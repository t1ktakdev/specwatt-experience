name: Publish SpecWATT Experience
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/experience-v4-crafted-figma]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm ci --prefix native --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck --prefix native
      - run: npm ci --prefix native/host --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck --prefix native/host
      - run: npm run export:android --prefix native/host
      - name: Validate Android preview generation
        working-directory: native/host
        run: npx expo prebuild --platform android --no-install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify browser experience
        run: |
          npm run dev > /tmp/specwatt-vite.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node tools/qa.mjs
          node tools/qa-v3.mjs
          node tools/qa-v4.mjs
          SPECWATT_URL=http://127.0.0.1:4173 node tools/qa-v41.mjs
          node tools/accessibility.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
